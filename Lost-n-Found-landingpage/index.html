<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17110d">
  <meta name="description" content="The Lost and Found — a home for independent creators and their worlds.">
  <title>The Lost and Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hub.css">
</head>
<body>
  <main class="hub">
    <header class="hub-heading">
      <img class="hub-badge" src="assets/LF-Badge.png" alt="The Lost and Found emblem">
      <p class="eyebrow">A home for wandering creators</p>
      <h1>The Lost <em>and</em> Found</h1>
      <p class="intro">Choose a creator to step into their corner of the world.</p>
    </header>
    <section class="creator-list" aria-label="Creators">
      <a class="creator-card" href="Kaires/" aria-label="Visit Kaires">
        <img src="Kaires/assets/kaires-logo.png" alt="">
        <span><small>Creator</small><strong>Kaires</strong></span>
        <span class="visit" aria-hidden="true">↗</span>
      </a>
      <p class="coming">More creators will find their way here soon.</p>
    </section>
    <footer>THE LOST AND FOUND</footer>
  </main>
</body>
</html>
